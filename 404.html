<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Empathia Village</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px; background: #0d1210; color: #f7f3e9; font-family: Arial, sans-serif; }
    main { width: min(100%, 620px); text-align: center; }
    img { width: 70px; height: 70px; margin: 0 auto 20px; object-fit: contain; }
    .brand { margin: 0; color: #d7bb78; font-size: 13px; letter-spacing: .25em; text-transform: uppercase; }
    .code { margin: 42px 0 0; color: #d7bb78; font-size: 16px; letter-spacing: .25em; }
    h1 { margin: 12px 0 18px; font: italic 400 clamp(44px, 8vw, 72px)/1 Georgia, serif; }
    p { margin: 0 auto; max-width: 440px; color: #c7c9c1; line-height: 1.7; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 38px; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 11px 20px; border: 1px solid #bfa15e; color: #f7f3e9; text-decoration: none; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    a:first-child { background: #bfa15e; color: #0d1210; }
    a:hover, a:focus-visible { outline: 2px solid #f7f3e9; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/images/brand/logo-emblem.webp" alt="" width="70" height="70">
    <p class="brand">Empathia Village · Baie Lazare, Mahé</p>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>This page is no longer available. Explore the villas or contact us for current project information.</p>
    <nav aria-label="Continue browsing">
      <a href="/">Home</a>
      <a href="/residencies">Villas</a>
      <a href="/contact">Contact</a>
    </nav>
  </main>
</body>
</html>
